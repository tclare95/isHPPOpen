schema: spec-driven

context: |
  isHPPOpen is a Next.js 16 / React 19 JavaScript App Router application on Vercel.
  Node baseline is >=20.19; CI runs Node 22, ESLint, Jest and Next.js build.
  App Router handlers live in app/api; business logic belongs in libs/services.
  Preserve shared { ok: true, data } / { ok: false, error } API envelopes.
  MongoDB, scraper S3 JSON and predictor S3 CSV contracts have independent consumers.
  Existing production spans tclare95/isHPPOpen (web), ishppopenScraper (Node / AWS SAM)
  and trent-predictor (Python / AWS Lambda); see docs/SYSTEM.md.
  The independently owned tclare95/river-data-platform (.NET 10 AWS Lambda)
  has its own approved stage/production release gates and product direction.
  isHPPOpen is a consumer of RDP, not its standalone product owner.
  New RDP product changes belong in RDP openspec. River Tracer and API-managed
  measurements have migrated to RDP and are historical copies here; other
  accepted RDP changes in this repository remain authoritative until migrated.
  See docs/RDP-INTEGRATION.md and RDP docs/ECOSYSTEM.md for the ownership map.
  Keep existing bootstrap-dotnet-observation-service OpenSpec ID for continuity.
  Do not force all domains into scalar observation data schemas or retention.
  Do not modify or repurpose legacy riverscraper Terraform/state/account or CI.
  Web main merges can deploy automatically to Vercel. Backend staging AND
  production AWS prepare/apply require explicit separate approval, target
  account/region assertions and reviewed manual apply; no PR/main auto-apply.
  Use local/CI fixtures by default and one tiny on-demand isolated integration
  stage (#75), not a 24/7 production-sized staging clone. Stage/prod may share
  an AWS account but NOT writable IAM/data storage/configuration. Stage collection
  schedules default DISABLED; test only small explicit source allowlists.
  Archive/TTL semantics remain domain-specific and unchanged in production:
  gauges 365-day hot and permanent canonical S3, CSO events 24 months hot
  from confirmed end then verified S3. Stage-only disposable cleanup needs
  its own explicit approval; never shorten canonical retention to save test cost.
  Existing behaviour is documented in docs/ARCHITECTURE.md and docs/CONTRACTS.md.
  Avoid large refactors, data migration or changed production behaviour as
  collateral to maintenance tasks.

rules:
  proposal:
    - Name the owning product/repository and affected consumers; use one canonical OpenSpec per capability, preserving older suite specs until expressly relocated.
    - Explicitly bound non-goals.
    - Describe compatibility, release and rollback consequences.
  specs:
    - Use SHALL or MUST requirements with testable WHEN/THEN scenarios.
    - Specify observable product/operator behaviour, invariants and failure cases, not implementation internals.
    - Prefer testable outcomes over prescribed schemas, classes, algorithms, PR counts or speculative abstractions. Allow the coding agent to choose the simplest approach meeting the criteria.
    - Include a technical choice as binding only when it is an accepted decision or necessary for correctness, security, data integrity or external compatibility; explain the constraint.
    - Preserve existing API and producer/consumer contracts unless explicitly changing them.
  design:
    - Justify decisions, include failure handling and migration/rollback where relevant.
    - Explain important constraints and trade-offs without turning illustrative options into mandatory architecture.
    - Reuse patterns appropriate to the target repository. Use Next.js service/route conventions in the web repo, and small DI/adapter/Lambda conventions for the new .NET backend.
  tasks:
    - Use small, independently verifiable tasks framed as outcomes with focused tests; do not prescribe exact code edits or PR splitting unless necessary.
    - Run the target repository's existing relevant verification: Jest/ESLint/Next.js build for web; dotnet restore/build/test/format and SAM validation for the .NET backend.
    - Never deploy, change production data, rotate credentials or upload models without explicit authorization.
